<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Kebab Zone, Underwood</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&family=Figtree:wght@400;600&display=swap">
<style>
:root{
  --bg:#ffffff;--ink:#0a0a0a;--muted:#5c5c5c;--line:#e4e4e4;--soft:#f5f5f5;
  --btn-bg:#0a0a0a;--btn-ink:#ffffff;--map-filter:grayscale(1) contrast(1.05);
  --radius:1rem;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0a0a0a;--ink:#f5f5f5;--muted:#a3a3a3;--line:#262626;--soft:#141414;
    --btn-bg:#f5f5f5;--btn-ink:#0a0a0a;--map-filter:grayscale(1) invert(1) contrast(.9);
  }
}
:root[data-theme="dark"]{
  --bg:#0a0a0a;--ink:#f5f5f5;--muted:#a3a3a3;--line:#262626;--soft:#141414;
  --btn-bg:#f5f5f5;--btn-ink:#0a0a0a;--map-filter:grayscale(1) invert(1) contrast(.9);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:5rem}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.05rem/1.65 Figtree,system-ui,sans-serif;
  padding-bottom:env(safe-area-inset-bottom,0px);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Bricolage Grotesque",Figtree,sans-serif;line-height:1.05;margin:0;letter-spacing:-.02em}
a{color:inherit}
.wrap{max-width:62rem;margin:0 auto;padding:0 1.25rem}

/* accessibility */
.skip{position:absolute;left:1rem;top:-4rem;background:var(--btn-bg);color:var(--btn-ink);padding:.6rem 1rem;border-radius:.5rem;z-index:20;text-decoration:none}
.skip:focus{top:1rem}
a:focus-visible,button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}

/* top bar */
.top{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);
  border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:1rem;min-height:4rem}
.logo{font:800 1.25rem "Bricolage Grotesque",sans-serif;text-decoration:none;letter-spacing:-.02em;white-space:nowrap}
.nav{display:flex;align-items:center;gap:.25rem}
.nav a{padding:.6rem .85rem;border-radius:999px;text-decoration:none;font-weight:600;font-size:.97rem;transition:background .15s}
.nav a:hover{background:var(--soft)}
.nav a.cta{background:var(--btn-bg);color:var(--btn-ink)}
.nav a.cta:hover{opacity:.85}
.icon-btn{width:2.5rem;height:2.5rem;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--ink);
  cursor:pointer;font-size:1.05rem;display:grid;place-items:center;margin-left:.35rem;transition:background .15s}
.icon-btn:hover{background:var(--soft)}
@media(max-width:560px){.nav a.hide-sm{display:none}}

/* buttons */
.btns{display:flex;gap:.75rem;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:3rem;padding:.75rem 1.5rem;border-radius:999px;
  font:600 1rem Figtree,system-ui,sans-serif;text-decoration:none;cursor:pointer;
  background:var(--btn-bg);color:var(--btn-ink);border:2px solid var(--btn-bg);transition:transform .15s,opacity .15s,background .15s}
.btn:hover{opacity:.88;transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.alt{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn.alt:hover{background:var(--ink);color:var(--bg);opacity:1}

/* hero */
.hero{padding:clamp(3.5rem,10vw,7rem) 0 clamp(3rem,8vw,5.5rem);border-bottom:1px solid var(--line)}
.eyebrow{display:inline-block;font-weight:600;font-size:.85rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:1.25rem}
.hero h1{font-size:clamp(3rem,11vw,7rem);font-weight:800;max-width:11ch}
.hero p{font-size:1.25rem;color:var(--muted);max-width:34rem;margin:1.5rem 0 2rem}

/* sections */
section{padding:clamp(3rem,7vw,5rem) 0}
h2{font-size:clamp(1.9rem,5vw,2.8rem);font-weight:800;margin-bottom:1rem}
.two{display:grid;gap:2.5rem;grid-template-columns:1fr}
@media(min-width:760px){.two{grid-template-columns:1fr 1fr}}
p{margin:0 0 1rem}
.muted{color:var(--muted)}

/* facts */
.facts{display:grid;grid-template-columns:repeat(2,1fr);margin-top:3rem;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
@media(min-width:760px){.facts{grid-template-columns:repeat(4,1fr)}}
.fact{padding:1.5rem 1.25rem;border-right:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 -1px -1px 0}
.fact b{font:800 2rem "Bricolage Grotesque",sans-serif;display:block;letter-spacing:-.02em}
.fact span{color:var(--muted);font-size:.95rem}

/* menu helpers (used on menu page) */
.menu{list-style:none;padding:.5rem 1.25rem;margin:0;border:1px solid var(--line);border-radius:var(--radius)}
.menu li{display:flex;justify-content:space-between;gap:1rem;padding:1rem 0;border-bottom:1px solid var(--line)}
.menu li:last-child{border:0}
.menu small{display:block;color:var(--muted)}
.price{font-weight:600;white-space:nowrap}
.grid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(16rem,1fr))}
.mcat{border:1px solid var(--line);border-radius:var(--radius);padding:1.25rem;background:var(--bg)}
.mcat h3{font-size:1.5rem;margin-bottom:.35rem}
.mcat .d{color:var(--muted);font-size:.95rem;margin:0 0 .75rem}
.mcat ul{list-style:none;margin:0;padding:0}
.mcat li{padding:.5rem 0;border-top:1px solid var(--line);font-weight:600}
.mcat small{display:block;font-weight:400;color:var(--muted)}
.note{color:var(--muted);font-size:.95rem;margin-top:.75rem}

/* band */
.band{background:var(--btn-bg);color:var(--btn-ink);text-align:center;padding:clamp(2rem,6vw,3.5rem) 1.25rem}
.band p{font:800 clamp(1.6rem,5vw,2.8rem)/1.1 "Bricolage Grotesque",sans-serif;margin:0;letter-spacing:-.02em}

/* find us */
#find{background:var(--soft)}
.card{background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);padding:1.5rem}
.card address{font-style:normal;font-size:1.15rem;line-height:1.6;margin-bottom:1.25rem}
.card address strong{display:block;font:800 1.4rem "Bricolage Grotesque",sans-serif;margin-bottom:.25rem;letter-spacing:-.02em}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:1rem}
.steps li{display:flex;gap:1rem;align-items:flex-start}
.steps .n{flex:none;width:2rem;height:2rem;border-radius:50%;background:var(--btn-bg);color:var(--btn-ink);display:grid;place-items:center;font-weight:600;font-size:.9rem}
.copied{min-height:1.4rem;margin:.75rem 0 0;font-size:.92rem;color:var(--muted)}
.map{margin-top:2rem;border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);background:var(--bg)}
.map iframe{display:block;width:100%;height:22rem;border:0;filter:var(--map-filter)}
@media(min-width:760px){.map iframe{height:28rem}}

footer{padding:2rem 0 2.5rem;color:var(--muted);font-size:.95rem;border-top:1px solid var(--line)}
footer .wrap{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap}
footer a{text-decoration:none;font-weight:600;color:var(--ink)}
footer a:hover{text-decoration:underline}
</style>
</head>
<body>
<a class="skip" href="#about">Skip to content</a>

<div class="top">
  <div class="wrap">
    <a class="logo" href="#top" aria-label="Kebab Zone, back to top">Kebab Zone</a>
    <nav class="nav" aria-label="Main">
      <a class="hide-sm" href="#about">About</a>
      <a class="hide-sm" href="#find">Find
